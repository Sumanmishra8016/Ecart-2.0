<aside class="cart">
  <h2 class="cart__title">Shopping Cart</h2>

  <p class="cart__empty" *ngIf="totalCount() === 0">
    Your cart is empty. Add a product to get started.
  </p>

  <ul class="cart__list" *ngIf="totalCount() > 0">
    <li class="cart__item" *ngFor="let item of items()">
      <img [src]="item.image" [alt]="item.name" class="cart__item-image" />

      <div class="cart__item-info">
        <p class="cart__item-name">{{ item.name }}</p>
        <p class="cart__item-price">{{ item.price | currency : 'INR' }}</p>
      </div>

      <div class="cart__item-qty">
        <button type="button" (click)="decrement(item.id)" aria-label="Decrease quantity">-</button>
        <span>{{ item.qty }}</span>
        <button type="button" (click)="increment(item.id)" aria-label="Increase quantity">+</button>
      </div>

      <button type="button" class="cart__item-remove" (click)="remove(item.id)" aria-label="Remove item">
        &times;
      </button>
    </li>
  </ul>

  <div class="cart__summary" *ngIf="totalCount() > 0">
    <div class="cart__summary-row">
      <span>Subtotal ({{ totalCount() }} items)</span>
      <span>{{ totalPrice() | currency : 'INR' }}</span>
    </div>
    <button type="button" class="btn-checkout">Checkout</button>
  </div>
</aside>
